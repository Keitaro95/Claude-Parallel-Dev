[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Backend Application"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pylint>=3.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# Mypy設定
[tool.mypy]
# 型定義のない外部パッケージのインポートエラーを無視
ignore_missing_imports = true
# 厳格な型チェックを有効化
strict = true
# Pythonバージョン指定
python_version = "3.12"
# 漸進的型付けを無効化（より厳格に）
disallow_untyped_defs = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
# None関連の厳格化
no_implicit_optional = true
strict_optional = true
# 警告設定
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
# その他
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Pylint設定
[tool.pylint.main]
# 並列実行（CPUコア数を自動検出）
jobs = 0
# 解析対象の拡張子
extension-pkg-whitelist = ["pydantic"]

[tool.pylint.messages_control]
# 無効化するメッセージID
disable = [
    "C0111",  # missing-docstring（Docstringは必要に応じて）
    "C0103",  # invalid-name（一部の変数名規則を緩和）
    "R0903",  # too-few-public-methods（Pydanticモデル等で発生）
    "W0212",  # protected-access（内部API使用時）
    "C0301",  # line-too-long（フォーマッタに任せる）
]

[tool.pylint.format]
# 最大行長（Black/Ruffと合わせる）
max-line-length = 120
# インデント
indent-string = "    "

[tool.pylint.basic]
# 適切な命名規則
good-names = ["i", "j", "k", "ex", "db", "id", "pk", "_"]
# 変数名パターン（snake_case）
variable-rgx = "[a-z_][a-z0-9_]{0,30}$"
# 関数名パターン（snake_case）
function-rgx = "[a-z_][a-z0-9_]{0,50}$"
# クラス名パターン（PascalCase）
class-rgx = "[A-Z][a-zA-Z0-9]+$"
# 定数名パターン（UPPER_CASE）
const-rgx = "(([A-Z_][A-Z0-9_]*)|(__.*__))$"

[tool.pylint.design]
# 関数の最大引数数
max-args = 7
# 関数の最大ローカル変数数
max-locals = 20
# 関数の最大return文数
max-returns = 6
# 関数の最大分岐数
max-branches = 15
# クラスの最大属性数
max-attributes = 10

# Pytest設定
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

# Coverage設定
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
